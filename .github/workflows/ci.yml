name: Snake CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snake-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Maven build and headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile, test and package without a desktop
        run: mvn --batch-mode --no-transfer-progress clean compile test package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: target/surefire-reports/
          if-no-files-found: warn
